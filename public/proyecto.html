<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Proyecto | Andrés Felipe Guerra</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) - Google Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var savedConsent = localStorage.getItem('cookie_consent');
      if (savedConsent === 'granted') {
        gtag('consent', 'default', {
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted',
          'analytics_storage': 'granted'
        });
      } else {
        gtag('consent', 'default', {
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied',
          'analytics_storage': 'denied'
        });
      }

      gtag('js', new Date());
      gtag('config', 'G-XG8HJTJMQY');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XG8HJTJMQY"></script>
    <script src="js/consent-banner.js" defer></script>

    <link rel="stylesheet" href="css/transition.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    <style>
        :root {
            --bg-base: #050505;
            --bg-card: rgba(18, 18, 18, 0.6);
            --bg-card-hover: rgba(24, 24, 24, 0.8);
            --primary: #3B82F6;
            --primary-dim: rgba(59, 130, 246, 0.15);
            --primary-glow: rgba(59, 130, 246, 0.3);
            --secondary: #333333;
            --text: #F2F2F2;
            --text-dim: #A1A1AA;
            --border: rgba(255, 255, 255, 0.06);
            --font-hero: 'Inter', system-ui, -apple-system, sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'Courier New', 'Consolas', monospace;
            --radius-md: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: -1;
        }
        .navbar {
            padding: 1.5rem 5%;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(20px);
        }
        .back-link {
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: color var(--transition);
        }
        .back-link:hover { color: var(--primary); }
        .container {
            max-width: 900px;
            margin: 4rem auto;
            padding: 0 5%;
        }
        .project-image-container {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 3rem;
            background: transparent;
        }
        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            mix-blend-mode: screen;
            border-radius: var(--radius-md);
        }
        .project-header {
            margin-bottom: 2rem;
        }
        .project-title {
            font-family: var(--font-hero);
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            color: var(--text);
            margin-bottom: 1rem;
            line-height: 1.1;
        }
        .project-description {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 2rem;
            line-height: 1.8;
        }
        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }
        .tag {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.4rem 1rem;
            border: 1px solid var(--primary-dim);
            border-radius: 8px;
            color: var(--primary);
            background: var(--primary-dim);
            text-transform: uppercase;
        }
        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            font-family: var(--font-hero);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 8px;
            text-decoration: none;
            transition: all var(--transition);
            cursor: pointer;
        }
        .btn-whatsapp {
            background: #25D366;
            color: #050505;
            border: 2px solid #25D366;
        }
        .btn-whatsapp:hover {
            background: transparent;
            color: #25D366;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--secondary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .lang-switcher {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 4px;
            gap: 2px;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .lang-btn:hover { color: var(--text); }
        .lang-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 0 12px var(--primary-glow);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="back-link" id="backLink">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span id="backLinkText">Volver al Portafolio</span>
        </a>
        <div class="lang-switcher">
            <button type="button" class="lang-btn active" id="langBtnES">ES</button>
            <button type="button" class="lang-btn" id="langBtnEN">EN</button>
        </div>
    </nav>

    <div class="container" id="project-container">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        const proyectosData = {
            'delivery-bot': {
                title: 'DeliveryBot',
                image: `
                  <picture>
                    <source srcset="img/1-1200.avif 1200w, img/1-800.avif 800w" type="image/avif">
                    <source srcset="img/1-1200.webp 1200w, img/1-800.webp 800w" type="image/webp">
                    <img src="img/1-1200.png" alt="DeliveryBot Project" class="project-img" loading="lazy">
                  </picture>
                `,
                description: {
                    es: 'Terminal de pedidos automatizada integrando WhatsApp y n8n para gestión y sincronización de entregas en tiempo real.',
                    en: 'Automated order terminal integrating WhatsApp and n8n for real-time delivery management and order synchronization.'
                },
                tags: ['Node.js', 'n8n', 'WhatsApp', 'Google Sheets'],
                repo: 'https://github.com/andresguerra321/delivery_bot_n8n'
            },
            'whatsapp-bot': {
                title: 'WhatsApp Bot IA',
                image: `
                  <picture>
                    <source srcset="img/2-1200.avif 1200w, img/2-800.avif 800w" type="image/avif">
                    <source srcset="img/2-1200.webp 1200w, img/2-800.webp 800w" type="image/webp">
                    <img src="img/2-1200.png" alt="WhatsApp Bot IA Project" class="project-img" loading="lazy">
                  </picture>
                `,
                description: {
                    es: 'Asistente conversacional con memoria, personalidad de agente de ventas, compatible con arquitecturas Cloud y Serverless (como Vercel).',
                    en: 'Conversational assistant with memory, sales agent personality, compatible with Cloud and Serverless architectures (like Vercel).'
                },
                tags: ['Baileys', 'Groq AI', 'LLaMA', 'Serverless', 'Vercel'],
                repo: 'https://github.com/andresguerra321/Bot-de-Whatsapp-plantilla-'
            },
            'banco-acme': {
                title: 'Banco ACME',
                image: `
                  <picture>
                    <source srcset="img/4-1200.avif 1200w, img/4-800.avif 800w" type="image/avif">
                    <source srcset="img/4-1200.webp 1200w, img/4-800.webp 800w" type="image/webp">
                    <img src="img/4-1200.png" alt="Banco ACME Project" class="project-img" loading="lazy">
                  </picture>
                `,
                description: {
                    es: 'Plataforma financiera simulada con arquitectura de bases de datos resiliente y transacciones seguras.',
                    en: 'Simulated financial platform with resilient database architecture and secure transactions.'
                },
                tags: ['Node.js', 'MySQL', 'JavaScript'],
                repo: 'https://github.com/andresguerra321/BANCO-ACME-'
            },
            'luau-task-engine': {
                title: 'Luau Async Task Engine',
                image: `
                  <div style="width: 100%; height: 100%; padding: 2rem; background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(30,41,59,0.95) 100%); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 0.9rem; color: #a5b4fc; border: 1px solid var(--border-hover); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <div style="display: flex; gap: 8px; margin-bottom: 1.2rem;">
                        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f56; display: inline-block;"></span>
                        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ffbd2e; display: inline-block;"></span>
                        <span style="width: 12px; height: 12px; border-radius: 50%; background: #27c93f; display: inline-block;"></span>
                        <span style="font-size: 0.8rem; color: var(--text-dim); margin-left: 0.8rem;">task_engine.luau — Luau Strict Typing &amp; Event Loop</span>
                    </div>
                    <div style="color: #60a5fa; font-weight: 600;">-- Luau High-Performance Async Task Engine &amp; Scheduler</div>
                    <div style="color: #f472b6; margin-top: 0.5rem;"><span style="color: #f472b6;">export type</span> TaskConfig = { id: <span style="color: #38bdf8;">string</span>, priority: <span style="color: #38bdf8;">number</span>, retries: <span style="color: #38bdf8;">number</span> }</div>
                    <div style="color: #e2e8f0; margin-top: 0.3rem;"><span style="color: #f472b6;">local</span> TaskEngine = {}</div>
                    <div style="color: #e2e8f0;"><span style="color: #f472b6;">function</span> TaskEngine.<span style="color: #818cf8;">dispatch</span>(config: TaskConfig): <span style="color: #38bdf8;">boolean</span></div>
                    <div style="color: #64748b; margin-top: 0.8rem;">-- Micro-tasking con corutinas nativas y evaluación de tipos en tiempo de compilación sin dependencias externas.</div>
                  </div>
                `,
                description: {
                    es: 'Motor de gestión de tareas asíncronas y eventos concurrentes desarrollado en Luau con tipado estricto (Strict Typing). Diseñado para estructuración modular de scripts, procesamiento de datos inmutables y ejecución con latencia sub-milisegundo.',
                    en: 'Asynchronous task management and concurrent event engine written in Luau with Strict Typing. Designed for modular script structuring, immutable data processing, and sub-millisecond execution latency.'
                },
                tags: ['Luau', 'Lua', 'Async Engine', 'Strict Typing', 'Coroutines', 'Performance'],
                repo: 'https://github.com/andresguerra321'
            }
        };

        function renderProject() {
            const lang = localStorage.getItem('portfolio_lang') || 'es';
            const params = new URLSearchParams(window.location.search);
            const projectId = params.get('id');
            
            if (projectId === 'guardian') {
                window.location.href = 'proyecto-guardian/guardian.html';
                return;
            }
            
            const project = proyectosData[projectId];
            const container = document.getElementById('project-container');

            if (project) {
                const desc = typeof project.description === 'object' ? (project.description[lang] || project.description.es) : project.description;
                const waText = lang === 'en'
                    ? encodeURIComponent(`Hello Andrés, I would like to get more information about the project ${project.title} that I saw on your portfolio.`)
                    : encodeURIComponent(`Hola Andrés, me gustaría saber más información sobre el proyecto ${project.title} que vi en tu portafolio.`);
                const waLink = `https://wa.me/573185602203?text=${waText}`;
                const btnText = lang === 'en' ? 'Contact on WhatsApp for more details' : 'Contactar por WhatsApp para más información';
                let tagsHtml = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
                
                container.innerHTML = `
                    <div class="project-image-container" id="projectImage">
                        ${project.image}
                    </div>
                    <div class="project-header">
                        <h1 class="project-title">${project.title}</h1>
                        <div class="tags">
                            ${tagsHtml}
                        </div>
                        <p class="project-description">${desc}</p>
                    </div>
                    <div class="actions">
                        <a href="${waLink}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                            ${btnText}
                        </a>
                    </div>
                `;
            } else {
                const titleNotFound = lang === 'en' ? 'Project Not Found' : 'Proyecto no encontrado';
                const descNotFound = lang === 'en' ? 'The project you are looking for does not exist or was moved.' : 'El proyecto que buscas no existe o fue movido.';
                const btnBack = lang === 'en' ? 'Back to home' : 'Volver al inicio';
                container.innerHTML = `
                    <div class="project-header">
                        <h1 class="project-title">${titleNotFound}</h1>
                        <p class="project-description">${descNotFound}</p>
                    </div>
                    <a href="index.html" class="btn btn-outline">${btnBack}</a>
                `;
            }
        }

        window.addEventListener('languageChanged', renderProject);
        renderProject();
    </script>
    <!-- i18n Engine Script -->
    <script src="js/i18n.js"></script>
    <script>
        function updateBackLink() {
            const lang = localStorage.getItem('portfolio_lang') || 'es';
            const backTxt = document.getElementById('backLinkText');
            if (backTxt) {
                backTxt.textContent = lang === 'en' ? 'Back to Portfolio' : 'Volver al Portafolio';
            }
        }
        window.addEventListener('languageChanged', updateBackLink);
        updateBackLink();
    </script>
    <!-- Page Transition (Anime.js) -->
    <script src="js/transition.js"></script>
</body>
</html>
